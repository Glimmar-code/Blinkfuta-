name: blink
description: Blink — a social feed, leaderboard, and marketplace app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend / auth
  supabase_flutter: ^2.8.0
  shorebird_code_push: ^1.1.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  phosphoricons_flutter: ^1.0.0
  flutter_dotenv: ^6.0.1
  image_picker: ^0.8.7+5
  flutter_paystack_plus: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env